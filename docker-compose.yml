services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # Paths inside the container (override anything relative from .env)
      WORKSPACES_DIR: /app/data/workspaces
      TARGET_REPO_PATH: /app/data/demo-shop-repo
      DATABASE_URL: sqlite:////app/data/fixsi.db
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      - fixsi-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  fixsi-data:
